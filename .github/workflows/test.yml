---
# Tests every pull request and every push to main. A push to main (or a
# manual run on main) also builds the site, alongside the tests, and
# publishes it to GitHub Pages, but only once every test job has passed. The
# weekly run only repeats the security and secrets jobs, so a new advisory
# for a pinned dependency or a leaked secret shows up without a push, runs
# the real build of Your flights, which needs Pyodide from its CDN (the
# pyodide job, which pushes to main and some pull requests run too), and
# draws new examples for the property tests (the properties job); a manual
# run does the last two as well. The checks job at the end is the one status
# a ruleset on main requires (see there).
#
# Every job that runs Python installs from uv.lock with `uv sync --locked`,
# which fails when the lock no longer matches pyproject.toml instead of
# resolving again; the lint job installs it as it is and checks it in a
# step of its own. Dependabot updates the two together (see dependabot.yml).
#
# A bump of @playwright/test (the `playwright` group, branches starting with
# dependabot/npm_and_yarn/playwright) needs a commit of its own for the jobs
# that run in the Playwright image, e2e, visual and pyodide: its tag and
# digest are bumped by hand on the branch (see the visual job), and until
# then every one of them failed at once against the old image. They skip
# Dependabot's own pushes there, and the lint job fails until the image
# reference is pushed. `github.actor` is whoever pushed (a re-run keeps
# it), so the push of the image reference runs all of them. zizmor calls
# the actor spoofable: here it can only skip jobs, and only in a pull
# request Dependabot opened (its author cannot be spoofed), whose lint job
# still checks the image against the library.
name: test
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Runs on main are not cancelled once they started. Of the pushes waiting
  # behind a running one only the newest is kept, so the newest commit is
  # always tested and deployed. The weekly run gets its own group so it can
  # never replace a push that is waiting to deploy.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The directory of the flights the site is built from, data/ unless the
  # repository variable FLOWN_INPUT_DIR names another: a copy of the
  # repository keeps its own flights there, apart from the ones of data/,
  # which an update from this repository brings along (see doc/hosting.md)
  FLOWN_INPUT_DIR: ${{ vars.FLOWN_INPUT_DIR || 'data' }}
jobs:
  # Everything that checks the sources without building a site, the spelling
  # and the obfuscation of the flights (in every commit pushed) among it: a
  # job of their own each waited for a runner as long as this one and ran
  # for seconds
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python, uv and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          python: "true"
      # The runtime dependencies and the test and dev extras, as uv.lock
      # pins them. --frozen installs the lock as it is, so a lock that no
      # longer matches pyproject.toml fails the check below rather than this
      # step, which every check waits for.
      - name: Install dependencies
        id: deps
        run: |
          uv sync --frozen --extra test --extra dev
          npm ci
      # Every check below runs even when an earlier one failed, so a single
      # run reports all of them
      - name: Check that uv.lock matches pyproject.toml
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv lock --check
      # typos comes with the dev extra in uv.lock, the same release
      # `make lint` and the pre-commit hook run
      - name: Check the spelling
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: typos
      - name: Check the pins and versions that have to agree
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python scripts/check_pins.py
      - name: Check Python formatting
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff format --check .
      - name: Check Prettier formatting
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run format:check
      - name: Run ruff
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff check .
      - name: Run mypy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mypy .
      - name: Type-check the frontend and the build scripts
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck
      - name: Type-check the unit and e2e tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck:tests
      - name: Run eslint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint
      # Files, exports and dependencies nothing reaches any more, then (in
      # production mode, from the entries marked ! in knip.json) files that
      # only tests import. The bundles have size budgets, so dead code is not
      # free here.
      - name: Check for unused files, exports and dependencies
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint:unused
      # The workflows, the composite actions and dependabot.yml: template
      # injection, credentials left in the checkout, unpinned actions and
      # the like. zizmor comes with the dev extra in uv.lock.
      # With the job's token it also runs its online audits (impostor
      # commits, actions with known advisories, a pin whose comment names
      # another version); `make lint` runs them when GH_TOKEN is set.
      - name: Audit the workflows
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github
      # The file checks of the pre-commit hooks, which ran nowhere else here:
      # pre-commit-hooks comes with the dev extra in uv.lock, so they are the
      # release the hooks run. Over every tracked text file (git grep -I
      # leaves out the binary ones), the flights of data/ left out of the
      # fixers as in .pre-commit-config.yaml, and those of FLOWN_INPUT_DIR
      # (see the top) with them. A fixer that changes a file fails, and
      # names it. Outside a merge check-merge-conflict checks nothing unless
      # told to assume one.
      - name: Check the ends of files, trailing whitespace, conflict markers, TOML and YAML
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          status=0
          git grep -Izl -e '' -- ':(exclude)data/' ':(exclude,glob,icase)**/*.km[lz]' > "$RUNNER_TEMP/text-files"
          xargs -0 end-of-file-fixer < "$RUNNER_TEMP/text-files" || status=1
          xargs -0 trailing-whitespace-fixer --markdown-linebreak-ext=md < "$RUNNER_TEMP/text-files" || status=1
          git grep -Izl -e '' | xargs -0 check-merge-conflict --assume-in-merge || status=1
          git ls-files -z -- '*.toml' | xargs -0 check-toml || status=1
          git ls-files -z -- '*.yml' '*.yaml' | xargs -0 check-yaml || status=1
          exit "$status"
      # The check imports nothing but the standard library. The flights of
      # the site, and data/ where they are elsewhere (FLOWN_INPUT_DIR, see
      # the top): it is just as public.
      - name: Check that the KML files are obfuscated
        if: ${{ !cancelled() }}
        run: |
          python -m flown.obfuscate data/ --check
          if [ "$FLOWN_INPUT_DIR" != data ]; then
            python -m flown.obfuscate "$FLOWN_INPUT_DIR" --check
          fi
      # Copies of flights from data/, and as public as they are
      - name: Check that the fixture flights of the visual snapshots are obfuscated
        if: ${{ !cancelled() }}
        run: python -m flown.obfuscate tests/fixtures/visual/ --check
      # The checks above read the last commit alone, but a push publishes
      # every commit it adds: one made with `git push --no-verify`, or a file
      # uploaded on GitHub, keeps the real dates of a commit a later one
      # fixes. So each commit a pull request adds to its base, or a push to
      # what main had before, is checked on its own with its message, as the
      # pre-push hook does (scripts/pre_push.py --range). The checkout holds
      # the last commit alone and keeps no credentials, so the history of
      # both ends is fetched here, with the job's token for a private copy
      # of the repository. The first push of main (no commit before it) is
      # not checked commit by commit: the history a copy brings along holds
      # commits from before the checks of today, which they refuse, and the
      # checks above read its tree. A manual run adds no commits.
      - name: Check that no commit pushed carries real dates
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "::notice::The first push of the branch: its history is not checked commit by commit"
            exit 0
          fi
          shas=("$HEAD_SHA" "$BASE_SHA")
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --quiet --no-tags --unshallow origin "${shas[@]}"
          python scripts/pre_push.py --range "$BASE_SHA" "$HEAD_SHA"

  unit:
    if: &not-weekly github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      # Python, Node.js, the dependencies, the bundles and the caches of the
      # OurAirports database and the elevation tiles
      - name: Set up the site build
        uses: ./.github/actions/site-build-setup
        with:
          extras: test dev
          flights: ${{ env.FLOWN_INPUT_DIR }}
      # The export contract test reads the data files of a real build. Of
      # the flights the site is published from: without the ground of a
      # flight the deploy fails (the site job), so a pull request that adds
      # one over a tile that cannot be fetched fails here already. The e2e
      # sites are built from data/, whatever FLOWN_INPUT_DIR says.
      - name: Build the site from the current sources
        run: python -m flown "$FLOWN_INPUT_DIR" --output-dir docs
        env:
          FLOWN_REQUIRE_AIRPORT_DB: "1"
          FLOWN_REQUIRE_TERRAIN: "1"
      # In an order of its own every run, so a test that only passes after
      # another one shows; the log names the seed to repeat it with
      # (`npx vitest run --sequence.seed=<seed>`). pytest does the same
      # through pytest-randomly (`pytest --randomly-seed=<seed>`).
      - name: Run JavaScript tests with coverage
        run: npm run test:coverage -- --sequence.shuffle
      # Also enforces fail_under from pyproject.toml. A bare --cov measures
      # the sources [tool.coverage.run] names, the scripts among them. The
      # slowest tests are listed, so one that grows shows in the log. The
      # property tests replay the same examples on every run, and the
      # properties job draws new ones (see tests/conftest.py). A copy of the
      # repository whose data/ holds flights of its own, as before
      # FLOWN_INPUT_DIR, skips the tests written against these (see
      # doc/hosting.md)
      - name: Run Python tests with coverage
        run: pytest -n auto --durations=15 --cov --cov-report=xml:coverage/coverage.xml --cov-report=term
        env:
          FLOWN_OWN_FLIGHTS: ${{ vars.FLOWN_OWN_FLIGHTS }}
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml,./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  # The wheel and the container image, each installed and run as a user
  # would. One job: either took about 35 s, most of it to set up a runner,
  # and a job of its own waited for a runner of its own.
  packaging:
    if: *not-weekly
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - *checkout
      - name: Set up Python, uv and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          python: "true"
      # Fails when the minified bundle exceeds the size budget in build.js
      - name: Build the JavaScript bundle
        run: npm ci && npm run build
      # With build isolation uv would fetch whatever setuptools satisfies
      # build-system.requires at the time, without a hash; the build group
      # has uv.lock pin it with its hashes like every other Python
      # dependency, and the wheel is built in the environment that holds it
      - name: Build the wheel
        run: |
          uv sync --locked --only-group build
          uv build --wheel --no-build-isolation --out-dir dist
      # The runtime dependencies uv.lock pins, with their hashes, then the
      # wheel on top without resolving anything again. uv installs them, so
      # the downloads come from its cache. uv export prints what it writes
      # to the file as well, unless --quiet.
      - name: Install the wheel into a fresh virtual environment
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --quiet --output-file "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" --no-deps dist/*.whl
      # Every asset the page loads, and none of the source maps. Run outside
      # the checkout so the installed package is imported, not the source
      # tree (see scripts/check_site_files.py).
      - name: Check the shipped assets
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_site_files.py" --package'
      # Loads the parser, the minifiers, the pipeline and the templates, which
      # `--version` alone never imports. scripts/smoke_site.py puts the
      # airport and runway fixtures in place of the OurAirports downloads
      # and checks afterwards that they were not replaced; `--no-terrain`
      # keeps the elevation tiles from being fetched on every run: the
      # sampling has tests of its own, and the image below builds without a
      # network.
      - name: Generate a site with the installed package
        working-directory: ${{ runner.temp }}
        env:
          FLOWN_CACHE_DIR: ${{ runner.temp }}/smoke/cache
        run: |
          python "$GITHUB_WORKSPACE/scripts/smoke_site.py" prepare smoke
          "$RUNNER_TEMP/wheel-venv/bin/flown" --version
          "$RUNNER_TEMP/wheel-venv/bin/flown" --no-terrain smoke/input --output-dir smoke/site
          python "$GITHUB_WORKSPACE/scripts/smoke_site.py" check smoke
      # The image itself is not published
      - name: Build the container image
        run: docker build -t flown .
      # Runs the image the way the Makefile does, the flights read-only, with
      # the airport and runway fixtures in place of the OurAirports downloads
      # (scripts/smoke_site.py, run with the runner's Python, which does not
      # have the package).
      # Without a network the elevation tiles cannot be fetched either, which
      # the build has to get through with the ground left out, and the check
      # finds the fixtures in the cache still as they were.
      - name: Generate a site with the image
        run: |
          smoke="$RUNNER_TEMP/smoke-image"
          python3 scripts/smoke_site.py prepare "$smoke"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$smoke/input:/data/input:ro" -v "$smoke/site:/data/site" -v "$smoke/cache:/cache" \
            flown input --output-dir site
          python3 scripts/smoke_site.py check "$smoke"
      # The same run as the image's own user (USER app, no home directory),
      # which the --user flag above bypasses. The mounts are world-writable
      # because that user exists only inside the image.
      - name: Generate a site as the image user
        run: |
          smoke="$RUNNER_TEMP/smoke-image-app"
          python3 scripts/smoke_site.py prepare --world-writable "$smoke"
          docker run --rm --network none \
            -v "$smoke/input:/data/input:ro" -v "$smoke/site:/data/site" -v "$smoke/cache:/cache" \
            flown input --output-dir site
          python3 scripts/smoke_site.py check "$smoke"

  # The sites the e2e jobs test, built once for all of them. The published
  # site has a tile API key and a default build has none, so there are two:
  # one with a dummy key and one without (see the e2e job). The fixture site
  # of the visual job is built here as well, with the same bundles.
  #
  # Both are built from data/, not from FLOWN_INPUT_DIR: the specs are
  # written against the flights of this repository, which a copy keeps in
  # data/ next to its own (see doc/hosting.md), so its pull requests get the
  # e2e jobs as well.
  e2e-sites:
    if: *not-weekly
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      # As in the unit job, with the runtime dependencies only
      - name: Set up the site build
        uses: ./.github/actions/site-build-setup
        with:
          flights: data
      # tests/e2e/fixtures.ts answers the tile servers locally, so the dummy
      # key never leaves the runner. The e2e jobs test a site with all of its
      # ground. The build without a key reads the same tiles from the cache
      # this one filled.
      - name: Build the site with a dummy tile API key
        run: python -m flown data --output-dir e2e-sites/dummy
        env:
          FLOWN_REQUIRE_AIRPORT_DB: "1"
          FLOWN_REQUIRE_TERRAIN: "1"
          CARTO_API_KEY: e2e-carto
      - name: Build the site without a tile API key
        run: python -m flown data --output-dir e2e-sites/none
        env:
          FLOWN_REQUIRE_AIRPORT_DB: "1"
          CARTO_API_KEY: ""
      # Kept for three days, as are the others here: "Re-run failed jobs"
      # on an e2e or visual job does not run this job again, and with the
      # site gone that re-run fails at its download, which reads like a new
      # failure
      - name: Upload the site with a dummy tile API key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-site-dummy
          path: e2e-sites/dummy
          if-no-files-found: error
          retention-days: 3
      - name: Upload the site without a tile API key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-site-none
          path: e2e-sites/none
          if-no-files-found: error
          retention-days: 3
      # The visual job compares this site inside the Playwright image, where
      # the package's own Python is not available (actions/setup-python
      # installs one there that cannot start: its scripts point at the tool
      # cache path of the runner, which the container mounts elsewhere). The
      # script keeps the build offline and its build stamp fixed, so it needs
      # none of the caches the setup restores.
      - name: Build the fixture site of the visual snapshots
        run: python scripts/build_visual_site.py
      - name: Upload the fixture site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-site
          path: visual-site
          if-no-files-found: error
          retention-days: 3

  # Runs in the Playwright image the visual job uses (see there for how it is
  # pinned and bumped), so the browsers and the libraries they draw with are
  # the same on every run and the same as a local run in that image, and no
  # job downloads browsers or installs system packages. WebGL is software
  # rendered there, as it was on the bare runner.
  #
  # The image is pulled by a step and the tests run in it with docker run,
  # not as the job's container: the runner pulls a job's container without
  # a time limit, and on 2026-10-12 eight jobs of three runs hung in that
  # pull until their job timed out, 15 to 25 minutes each. The pull, which
  # starts in the background right after the checkout, gives up after two
  # minutes and tries again once; the rest of the job (Node.js, npm ci, the
  # artifacts) runs on the runner, and the tests read the checkout and its
  # node_modules mounted at the same path. They run on the image's own
  # Node.js, which may be older than the runner's.
  e2e:
    name: e2e (${{ matrix.name }})
    needs: e2e-sites
    # Not for Dependabot's Playwright bumps, see the top, and not in a copy
    # of the repository whose data/ holds flights of its own, as before
    # FLOWN_INPUT_DIR: the specs expect these (FLOWN_OWN_FLIGHTS, see
    # doc/hosting.md)
    if: >- # zizmor: ignore[bot-conditions]
      github.event_name != 'schedule' &&
      vars.FLOWN_OWN_FLIGHTS != '1' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/playwright'))
    runs-on: ubuntu-24.04
    # Twice the longest job of a green run (about 5.5 minutes), and the image
    # pull's two attempts on top. The heavy tests allow up to five minutes
    # each (the relief tests of 3d-relief.spec.ts three), so their jobs get
    # longer.
    timeout-minutes: ${{ matrix.timeout-minutes || 15 }}
    env: &playwright-image
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    strategy:
      fail-fast: false
      # Every project runs against the published setup, with the dummy key.
      # Without a key only the requests for the base map change, so that
      # variant (no-key) runs just the tests that make and check those
      # requests, tagged @keys at the end of their titles, on the desktop,
      # instead of the whole suite a second time. It needs the other site,
      # so it is a second run after the first in the job with the shortest
      # run (webkit-heavy, about two minutes): its six tests took 25 s, in a
      # job of its own that took 80 s to set up and wait for a runner,
      # among the 20 jobs of a run that the account's concurrent job limit
      # already held back.
      #
      # Software WebGL runs one browser per core of the 4-vCPU runner. The
      # desktop project is split into three shards, the mobile project into
      # two, on runners of their own. Playwright splits a project by the
      # number of tests, not their time: with two even mobile shards the
      # second needed about 315 s of tests against 150 to 220 s of the
      # first (the phone's state.spec.ts tests take 30 to 44 s each). The
      # webkit project, once 6.7 minutes in one job, ran in two shards of 83
      # to 124 s and 122 to 163 s of tests after its desktop specs moved to
      # webkit-desktop: two runners of the 20 the account runs at once for
      # 3.5 to 4.8 minutes of tests, so it is one job again, about as long
      # as the longest desktop and mobile shards. The desktop and mobile
      # shards are weighted (PWTEST_SHARD_WEIGHTS, the share of the tests
      # each shard gets, in file order; whole numbers, Playwright reads them
      # with parseInt, so "0.85" would be 0 and leave a shard empty). The last
      # desktop shard always drew the slow specs state, selection and
      # wrapped-export, 955 s of tests against 681 s of the first. Three
      # even mobile shards ran 130, 140 and 202 s of tests; weighted 3:2,
      # the durations of two runs put the two shards at 225 to 235 s each,
      # under the desktop shards. The variable is Playwright's own but not
      # documented; should an update drop it, the shards split evenly again.
      #
      # The tests tagged @heavy (HEAVY in tests/e2e/fixtures.ts) draw the 3D
      # view or turn the globe with the flights on it, which takes seconds per
      # frame there. Among three other browsers they ran out of time (Reset
      # view in state.spec.ts, the globe of orientation.spec.ts, the hotspot
      # tour, the chase view) and took the cores from the specs beside them,
      # so in both engines they run in a job of their own with two browsers,
      # and without a retry, which would not turn the run green
      # (failOnFlakyTests) and doubles an attempt of minutes: with it, a run
      # where they all time out would outlast the job and lose its report.
      # The relief tests among them still run one after the other in one
      # worker (3d-relief.spec.ts, which sorts first so that worker starts
      # them at once). In the desktop project that chain took 283 s of the
      # heavy job's 286 s of tests, so its last two tests (tagged @heavy-2,
      # HEAVY_SECOND in tests/e2e/fixtures.ts, about 104 s) run in a second
      # heavy job. The other jobs of the desktop and webkit-desktop projects
      # leave them all out. A tag that matches nothing leaves the heavy jobs
      # with no tests, which fails them.
      matrix:
        include:
          - name: desktop-1
            project: desktop
            shard: 1/3
            shard-weights: &desktop-weights "24:20:17"
            grep-invert: "@heavy"
          - name: desktop-2
            project: desktop
            shard: 2/3
            shard-weights: *desktop-weights
            grep-invert: "@heavy"
          - name: desktop-3
            project: desktop
            shard: 3/3
            shard-weights: *desktop-weights
            grep-invert: "@heavy"
          - name: desktop-heavy
            project: desktop
            grep: "@heavy"
            grep-invert: "@heavy-2"
            workers: 2
            retries: 0
            # Five relief tests of up to 3 minutes each, one after the other
            timeout-minutes: 20
          - name: desktop-heavy-2
            project: desktop
            grep: "@heavy-2"
            workers: 2
            retries: 0
            timeout-minutes: 15
          - name: mobile-1
            project: mobile
            shard: 1/2
            shard-weights: &mobile-weights "3:2"
          - name: mobile-2
            project: mobile
            shard: 2/2
            shard-weights: *mobile-weights
          # The phone interface in Safari's engine
          - name: webkit
            project: webkit
          # Turning, the globe, the replay and the error-free interactions
          # in Safari's engine
          - name: webkit-desktop
            project: webkit-desktop
            grep-invert: "@heavy"
          # The project does not retry. The tests without a tile API key
          # run after these (see above).
          - name: webkit-heavy
            project: webkit-desktop
            grep: "@heavy"
            workers: 2
            # All seven relief tests of up to 3 minutes each, one after the
            # other, and the tests without a key after them
            timeout-minutes: 25
            # WebKit's own output in the job log: its page crashed once in
            # the sloped relief test without a page or console error, after
            # blocking the main thread for 30 s
            debug: pw:browser
            no-key: true
    steps:
      - *checkout
      # Two attempts of two minutes each; a pull takes about 30 s. It runs in
      # the background while Node.js and the npm dependencies are set up,
      # which took 15 s of it one after the other, and the step that waits
      # for it below is the one that fails. Its output goes to a file, which
      # that step prints: a background process that kept the step's output
      # open would hold the step until it ended. Both steps skip where the
      # pyodide job's check of what changed set PYODIDE_BUILD to false; no
      # other job sets it.
      - &start-image-pull
        name: Start pulling the Playwright image
        if: env.PYODIDE_BUILD != 'false'
        run: |
          {
            status=1
            for attempt in 1 2; do
              if timeout 120 docker pull --quiet "$PLAYWRIGHT_IMAGE"; then status=0; break; fi
              echo "::warning::pulling the Playwright image failed or took over two minutes (attempt $attempt)"
            done
            echo "$status" > "$RUNNER_TEMP/image-pull.tmp"
            mv "$RUNNER_TEMP/image-pull.tmp" "$RUNNER_TEMP/image-pull.status"
          } < /dev/null > "$RUNNER_TEMP/image-pull.log" 2>&1 &
      - name: Set up Node.js
        uses: ./.github/actions/setup-toolchain
      - name: Install npm dependencies
        run: npm ci
      # The two attempts above take four minutes at most
      - &wait-image-pull
        name: Wait for the Playwright image
        id: pull
        if: env.PYODIDE_BUILD != 'false'
        run: |
          for _ in $(seq 300); do
            if [ -e "$RUNNER_TEMP/image-pull.status" ]; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/image-pull.log"
          test "$(cat "$RUNNER_TEMP/image-pull.status" 2>/dev/null)" = 0
      # tests/e2e/site-check.ts compares the hash of the sources the site
      # was built from, which its bundles and map_config.js carry, with
      # this checkout. The site with the dummy key into docs/, where the
      # test server looks.
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-site-dummy
          path: docs
      # CI is the runner's, which playwright.config.ts reads; the image
      # brings the browsers and PLAYWRIGHT_BROWSERS_PATH. Docker caps
      # /dev/shm at 64 MB, which a browser per core outgrows (--ipc=host).
      - name: Run the E2E tests
        env:
          # Checked against docs/map_config.js by tests/e2e/site-check.ts
          E2E_API_KEYS: dummy
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          PWTEST_SHARD_WEIGHTS: ${{ matrix.shard-weights }}
          GREP: ${{ matrix.grep }}
          GREP_INVERT: ${{ matrix.grep-invert }}
          WORKERS: ${{ matrix.workers }}
          RETRIES: ${{ matrix.retries }}
          DEBUG: ${{ matrix.debug }}
        run: |
          args=(--project="$PROJECT")
          if [ -n "$SHARD" ]; then args+=(--shard="$SHARD"); fi
          if [ -n "$GREP" ]; then args+=(--grep="$GREP"); fi
          if [ -n "$GREP_INVERT" ]; then args+=(--grep-invert="$GREP_INVERT"); fi
          if [ -n "$WORKERS" ]; then args+=(--workers="$WORKERS"); fi
          if [ -n "$RETRIES" ]; then args+=(--retries="$RETRIES"); fi
          docker run --rm --ipc=host -v "$PWD:$PWD" -w "$PWD" \
            -e CI -e E2E_API_KEYS -e PWTEST_SHARD_WEIGHTS -e DEBUG \
            "$PLAYWRIGHT_IMAGE" npx playwright test "${args[@]}"
      # The site without a key replaces the other in docs/, and the run
      # writes its results beside the first one's (E2E_RUN, see
      # playwright.config.ts). Also after a failure of the first run, so a
      # run reports both, but not without the image: docker run would pull
      # it again, without the pull step's time limit.
      - name: Download the site without a tile API key
        if: ${{ !cancelled() && matrix.no-key && steps.pull.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-site-none
          path: e2e-site-none
      - name: Run the E2E tests without a tile API key
        if: ${{ !cancelled() && matrix.no-key && steps.pull.outcome == 'success' }}
        env:
          E2E_API_KEYS: none
          E2E_RUN: no-key
        run: |
          rm -rf docs
          mv e2e-site-none docs
          docker run --rm --ipc=host -v "$PWD:$PWD" -w "$PWD" \
            -e CI -e E2E_API_KEYS -e E2E_RUN \
            "$PLAYWRIGHT_IMAGE" npx playwright test --project=desktop --grep=@keys
      # Also when the job timed out or was cancelled: the traces of the tests
      # that failed until then are what shows why
      - name: Upload Playwright results
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.name }}
          path: |
            test-results*/
            playwright-report*/
          if-no-files-found: ignore
          retention-days: 7
      # The duration of every test (the JSON reporter of playwright.config.ts),
      # from every run and not only the failed ones: a test that creeps up
      # on its timeout shows here before it times out. List the slowest with
      # `node scripts/e2e_durations.js <file>`.
      - name: Upload the test durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings-${{ matrix.name }}
          path: test-results/e2e-timings.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload the test durations without a tile API key
        if: ${{ always() && matrix.no-key }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings-no-key
          path: test-results-no-key/e2e-timings.json
          if-no-files-found: ignore
          retention-days: 3

  # Pixel comparisons are only meaningful where the rendering is fixed, so
  # this one runs inside the Playwright image, which is also what the
  # snapshots were generated in (see CONTRIBUTING.md). The snapshots allow no
  # differing pixel, so the site is not the one of data/, whose figures move
  # with every flight, but the fixture site of scripts/build_visual_site.py:
  # a few committed flights, the airport and runway fixtures in place of the
  # OurAirports downloads and a fixed build stamp. The e2e-sites job builds
  # it, since the package needs a Python the image does not carry. The image
  # is pulled and run as in the e2e job (see there).
  #
  # The image tag has to match the
  # @playwright/test version package-lock.json pins; scripts/check_pins.py
  # fails the lint job when the two drift apart. Dependabot does not bump
  # the image: with every @playwright/test bump set the new tag here and in
  # the e2e job, with the digest of its multi-arch index (the
  # Docker-Content-Digest header of
  # https://mcr.microsoft.com/v2/playwright/manifests/<tag>), and the same
  # reference in CONTRIBUTING.md and doc/development/testing.md
  # (check_pins.py checks all of them). The e2e job holds the reference,
  # which this job and the pyodide job take with it. A digest left behind
  # keeps pulling the old image, whatever the tag next to it says.
  visual:
    needs: e2e-sites
    # Not for Dependabot's Playwright bumps, see the top
    if: >- # zizmor: ignore[bot-conditions]
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/playwright'))
    runs-on: ubuntu-24.04
    # About 1.5 minutes on a green run, and the image pull's two attempts
    timeout-minutes: 10
    env: *playwright-image
    steps:
      - *checkout
      - *start-image-pull
      - name: Set up Node.js
        uses: ./.github/actions/setup-toolchain
      - name: Install npm dependencies
        run: npm ci
      - *wait-image-pull
      # The bundles come with it, so tests/e2e/site-check.ts can check them
      # against the sources in this checkout
      - name: Download the fixture site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-site
          path: visual-site
      - name: Compare the page against the committed snapshots
        run: |
          docker run --rm --ipc=host -v "$PWD:$PWD" -w "$PWD" -e CI \
            "$PLAYWRIGHT_IMAGE" npx playwright test --project=visual --project=visual-phone
      # The report carries the expected, actual and diff images side by side
      - name: Upload the visual diff
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base of a pull request, for the comparison below
          fetch-depth: 0
          persist-credentials: false
      # npm audit reads package-lock.json and installs nothing, so without
      # the npm cache: restoring it cost 51 MB a run, and saving it raced the
      # jobs that do install
      - name: Set up Python, uv and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          python: "true"
          npm-cache: "false"
      # A pull request audits the dependencies only when it changes them: an
      # advisory for a version the base already pins turned pull requests
      # red that were fine, and the next push to main or the weekly run
      # reports it anyway. A base the clone cannot compare with audits as
      # well: the step fails closed
      - name: Check whether the dependencies changed
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] &&
            changed="$(git diff --name-only "$BASE_SHA" HEAD -- \
              uv.lock package-lock.json package.json)" &&
            [ -z "$changed" ]; then
            echo "audit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no lock file changed; skipping the dependency audits"
          else
            echo "audit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Python dependencies
        if: steps.deps.outputs.audit == 'true'
        run: uv sync --locked --extra dev
      # pip-audit is pinned in uv.lock like every other tool. It audits every
      # package uv.lock pins, every extra and the build group among them,
      # exported with their hashes, so it reads the pins as they are, without
      # pip resolving anything: --no-deps warned on every call, and left out
      # a package (packaging) that the lock pinned. --quiet keeps the export
      # out of the log, as in the packaging job.
      - name: Audit the Python lock file
        if: steps.deps.outputs.audit == 'true'
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project \
            --format requirements-txt --quiet --output-file "$RUNNER_TEMP/requirements.txt"
          pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Audit npm dependencies
        if: steps.deps.outputs.audit == 'true'
        run: npm audit --audit-level=high

  # The scan for secrets, which checks requires: a commit that carries one
  # must not merge, and must not be published. A job of its own rather than
  # a step of the security job, which gates nothing (see checks), and not a
  # step of the lint job, which the weekly run leaves out.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole commit history, or the commits of a pull
          # request from its base on
          fetch-depth: 0
          persist-credentials: false
      # The same gitleaks release as the pre-commit hook, whose rev Dependabot
      # bumps (a commit, with the release in its "# frozen:" comment), pulled
      # by digest like every other image and action here, with its release
      # in the comment after it. The digest is the multi-arch index of the
      # tag; a bump of the hook rev has to update both by hand
      # (`docker manifest inspect -v` or the registry's
      # Docker-Content-Digest header). Until it does, scripts/check_pins.py
      # fails the lint job, which compares the comment with the hook's rev,
      # and this step, which compares the release the image reports. The
      # config's [[allowlists]] needs gitleaks 8.25 or newer. A
      # pull request scans only the commits it adds on top of its base, and
      # a push to main the commits it pushed (the whole history took 80 to
      # 106 s a run); the weekly run and a manual one scan the whole history.
      # A push whose earlier head the clone does not have (a branch's first
      # push, a force push) scans the whole history as well. A pull request
      # is scanned with the .gitleaks.toml of its base, so it cannot
      # allowlist a secret it adds there: a change of the allowlist applies
      # from the pull requests after the one that merged it (the built-in
      # rules alone should the base have none). A .gitleaksignore or a
      # gitleaks:allow comment of its own still hides one, as gitleaks reads
      # both from the tree it scans; either shows in its diff. Pushes, the
      # weekly run and a manual one read the checkout's. The pull and the
      # scan have time limits: a weekly scan once sat silent until the job
      # timed out, and that week's audit never ran.
      - name: Scan the commit history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          version=$(awk '$3 == "https://github.com/gitleaks/gitleaks" { found = 1; next } found && $1 == "rev:" { print ($4 == "frozen:" ? $5 : $2); exit }' .pre-commit-config.yaml)
          test -n "$version" || { echo "::error::no gitleaks rev in .pre-commit-config.yaml"; exit 1; }
          pulled=$(timeout 300 docker run --rm "$GITLEAKS_IMAGE" version)
          test "${pulled#v}" = "${version#v}" || {
            echo "::error::the pinned gitleaks image is $pulled, the pre-commit hook $version; update the digest in test.yml"
            exit 1
          }
          range=()
          config="$PWD/.gitleaks.toml"
          if [ -n "$BASE_SHA" ]; then
            range=(--log-opts="$BASE_SHA..HEAD")
            config="$RUNNER_TEMP/gitleaks.toml"
            if ! git show "$BASE_SHA:.gitleaks.toml" > "$config"; then
              echo "::warning::the base has no .gitleaks.toml; scanning with the built-in rules alone"
              printf '[extend]\nuseDefault = true\n' > "$config"
            fi
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range=(--log-opts="$BEFORE_SHA..HEAD")
          fi
          timeout 600 docker run --rm -v "$PWD:/repo:ro" -v "$config:/config.toml:ro" "$GITLEAKS_IMAGE" \
            git --redact --verbose --config /config.toml "${range[@]}" /repo

  # The real build of Your flights: Pyodide, lxml and the site's Python from
  # flown-src.zip, fetched by the page's worker from their hosts
  # (tests/e2e/local-flights-pyodide.spec.ts). The e2e jobs leave it out,
  # since the hermetic suite blocks every host but the site's and a build
  # takes a minute or two. It runs on every push to main, weekly and in a
  # manual run, so a Pyodide release the pinned version stops resolving to
  # shows within a week, and in a pull request that changes any of its
  # inputs (the Python of the site, the worker that runs it, this spec and
  # what builds and runs them; see the first step), so Python that does not
  # run there shows before it merges. It gates nothing (checks leaves it
  # out): it depends on the CDN, whose outage must not hold back the
  # flights, and a failure on main shows in the run. The site is built as
  # in the e2e-sites job, with the dummy key, and the test runs in the
  # Playwright image as there. Not for Dependabot's Playwright bumps, see
  # the top.
  pyodide:
    if: >- # zizmor: ignore[bot-conditions]
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/playwright'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: *playwright-image
    steps:
      # The merge commit of a pull request and its first parent, the head of
      # the base branch, so the step below sees what the pull request changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Every input of this job: flown/*.py takes in every Python module of
      # the package (a pathspec's * crosses directories), which is what
      # flown-src.zip ships; */local*.ts the worker, the page's side of the
      # build, the store and the panel the spec drops its files on, and the
      # rest of what esbuild bundles into the worker or the page's side of
      # the build (`node build.js --metafile` lists the inputs of the app's
      # bundles only; build the entry point with metafile: true for the
      # worker's); the template holds the page's CSP. Then what builds the
      # bundles and the site, installs them and runs the spec, this workflow
      # and its actions among it, and the spec with the modules of tests/e2e
      # it imports and the flights it drops. A diff that cannot be made (no
      # parent) builds as well: the step fails closed. Every step after it
      # skips when it sets PYODIDE_BUILD to false, the ones of the image pull
      # among them (see the e2e job).
      - name: Check whether the build in the page changed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- 'flown/*.py' flown/templates \
            'flown/frontend/*/local*.ts' flown/frontend/services/lazyImport.ts \
            flown/frontend/utils/withTimeout.ts \
            build.js scripts/build-helpers.js scripts/source-hash.js scripts/vendor.js \
            package.json package-lock.json tsconfig.json pyproject.toml uv.lock \
            .github/workflows/test.yml .github/actions playwright.config.ts \
            tests/e2e/local-flights-pyodide.spec.ts tests/e2e/fixtures.ts tests/e2e/helpers.ts \
            tests/e2e/map.ts tests/e2e/site-check.ts tests/e2e/sites.ts \
            tests/fixtures/visual/1_DEAGJ_DA20.kml tests/fixtures/visual/49_DEHYL_DA40.kml; then
            echo "PYODIDE_BUILD=false" >> "$GITHUB_ENV"
            echo "::notice::none of the inputs of the Pyodide build changed; skipping it"
          fi
      - *start-image-pull
      - name: Set up the site build
        if: env.PYODIDE_BUILD != 'false'
        uses: ./.github/actions/site-build-setup
        with:
          flights: ${{ env.FLOWN_INPUT_DIR }}
      - name: Build the site with a dummy tile API key
        if: env.PYODIDE_BUILD != 'false'
        run: python -m flown "$FLOWN_INPUT_DIR" --output-dir docs
        env:
          CARTO_API_KEY: e2e-carto
      - *wait-image-pull
      - name: Build two flights with Pyodide in the page
        if: env.PYODIDE_BUILD != 'false'
        env:
          E2E_API_KEYS: dummy
          FLOWN_E2E_PYODIDE: "1"
        run: |
          docker run --rm --ipc=host -v "$PWD:$PWD" -w "$PWD" \
            -e CI -e E2E_API_KEYS -e FLOWN_E2E_PYODIDE \
            "$PLAYWRIGHT_IMAGE" npx playwright test --project=desktop local-flights-pyodide
      # The spec skips its test without FLOWN_E2E_PYODIDE, and a run whose
      # one test was skipped passes: the report of the JSON reporter
      # (playwright.config.ts) has to count the one test as passed
      - name: Check that the build ran and passed
        if: env.PYODIDE_BUILD != 'false'
        run: |
          report=test-results/e2e-timings.json
          jq .stats "$report"
          jq -e '.stats | .expected == 1 and .skipped == 0 and .unexpected == 0 and .flaky == 0' "$report" >/dev/null || {
            echo "::error::the Pyodide build did not run as the one test that passed"
            exit 1
          }
      - name: Upload Playwright results
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-pyodide
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # New examples for the property tests, Hypothesis and fast-check, weekly
  # and in a manual run, ten times as many for a test that sets no number of
  # its own. The unit job replays the same ones on every run (see
  # tests/conftest.py and tests/frontend/setup.ts), so an example drawn
  # there by chance cannot fail a pull request it has nothing to do with. A
  # failure prints the blob (or the seed and path) that reproduces it, and
  # the example goes into its test, with @example for Hypothesis. The tests
  # need neither the bundles nor a site.
  properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Set up Python, uv and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          python: "true"
      - name: Install Python dependencies
        run: uv sync --locked --extra test
      - name: Install npm dependencies
        run: npm ci
      - name: Run the property tests with new examples
        run: pytest -n auto -m hypothesis
        env:
          FLOWN_HYPOTHESIS_EXPLORE: "1"
      # The fast-check tests likewise (see tests/frontend/setup.ts): every
      # test file that imports it, so a new one is drawn for as well. A
      # failure prints the seed and path that replay it.
      - name: Run the JavaScript property tests with new examples
        if: ${{ !cancelled() }}
        run: git grep -lz -e "from \"fast-check\"" -- 'tests/frontend/**/*.test.ts' | xargs -0 -r npx vitest run
        env:
          FLOWN_HYPOTHESIS_EXPLORE: "1"

  # The one status a ruleset on main requires of a pull request: every test
  # job a pull request runs, whatever the matrix, so a job or a shard added
  # later needs no change of the repository settings. The ruleset requires
  # the branch to be up to date with main as well (strict status checks; the
  # merge queue is not available to a repository a user owns), so what
  # merges is what this job passed on: "Update branch" on the pull request
  # merges main into it, and the run of that push is the one that counts.
  # Not the security job, for the reason publishing does not wait for it
  # (below): a new advisory would hold back every pull request, the flights
  # among them; the secrets job, which scans the commits, is in. Nor the
  # pyodide job, which depends on Pyodide's CDN. A job may be skipped only
  # where its own condition skips it on purpose, Dependabot's own pushes to
  # a Playwright branch (see the top), and the e2e jobs in a copy of the
  # repository whose data/ holds flights of its own (FLOWN_OWN_FLIGHTS);
  # anywhere else a skip, a failure or a cancellation fails this job. The
  # weekly run leaves this job out, as it does all of these but secrets.
  checks:
    needs:
      - lint
      - unit
      - packaging
      - e2e-sites
      - e2e
      - visual
      - secrets
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every test job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The conditions of the jobs that skip Dependabot's own pushes
          SKIPS_ALLOWED: >-
            ${{ github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.actor == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/npm_and_yarn/playwright') }}
          OWN_FLIGHTS: ${{ vars.FLOWN_OWN_FLIGHTS }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$OWN_FLIGHTS" = 1 ]; then
            RESULTS=$(echo "$RESULTS" | jq '.e2e.result |= if . == "skipped" then "success" else . end')
          fi
          allowed='["success"]'
          if [ "$SKIPS_ALLOWED" = true ]; then allowed='["success", "skipped"]'; fi
          failed=$(echo "$RESULTS" | jq -r --argjson allowed "$allowed" \
            'to_entries[] | select(.value.result as $r | $allowed | index($r) | not) | .key')
          if [ -n "$failed" ]; then
            echo "::error::did not pass: $(echo "$failed" | paste -sd " ")"
            exit 1
          fi

  # Publishing waits for every test job, through the one job that checks
  # them all. The security and pyodide jobs are not gates: a new advisory
  # for a test dependency or an outage of Pyodide's CDN must not hold back
  # new flights, and the weekly run reports either anyway.
  publishable:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.head.outputs.publish }}
    steps:
      # A re-run of an older run keeps its commit; publishing that would
      # replace the site of a newer push
      - name: Check that the commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved on to $head; not publishing $GITHUB_SHA"
          fi

  # Builds the published site from the sources and the KML files in data/
  # (or the directory FLOWN_INPUT_DIR names, see the top). Nothing generated
  # is committed, so every deployment is exactly what the tested commit
  # produces. Only this job sees the real tile API key. It runs alongside
  # the tests rather than after them, under the condition of publishable:
  # the build only uploads an artifact, and the deploy job publishes it once
  # publishable says the tests passed on the head of main.
  site:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # pages: read for the address of the site, see "Look up the address"
    permissions:
      contents: read
      pages: read
    steps:
      - *checkout
      # As in the unit job, with the runtime dependencies only
      - name: Set up the site build
        uses: ./.github/actions/site-build-setup
        with:
          flights: ${{ env.FLOWN_INPUT_DIR }}
      # The link preview images, cached under a hash of what each one draws
      # and of the module that draws them (flown/previews.py), so the
      # latest cache has every image that did not change
      - name: Cache the link preview images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flown/previews
          key: previews-${{ hashFiles(format('{0}/**/*.kml', env.FLOWN_INPUT_DIR), format('{0}/**/*.kmz', env.FLOWN_INPUT_DIR), 'flown/*.py') }}
          restore-keys: previews-
      # Where the site is published: the link previews name their images by
      # absolute URLs, which the build cannot know by itself. Only reads the
      # Pages configuration; the deploy job below publishes.
      - name: Look up the address of the site
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The deployed site must not lose the ground of a flight to a failed
      # tile download: the build fails instead of publishing without it.
      # GitHub Pages derives the ETags from the modification times, which
      # upload-pages-artifact keeps in its tar; taken from the content, they
      # keep the browser caches of the files a deploy did not change.
      - name: Build the site
        run: python -m flown "$FLOWN_INPUT_DIR" --output-dir site
        env:
          FLOWN_REQUIRE_AIRPORT_DB: "1"
          FLOWN_REQUIRE_TERRAIN: "1"
          FLOWN_STABLE_MTIMES: "1"
          FLOWN_SITE_URL: ${{ steps.pages.outputs.base_url }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs:
      - publishable
      - site
    if: needs.publishable.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Deployments never overlap and are never cancelled half way
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages site configuration. The Pages source has to be set to
      # "GitHub Actions" by hand (see CONTRIBUTING.md): enabling or switching
      # it needs a token with more rights than GITHUB_TOKEN.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

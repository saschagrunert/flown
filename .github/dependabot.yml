---
# Each ecosystem runs at a time and on a day of its own: a run of the test
# workflow starts about 20 jobs, as many as the account runs at once, and
# four pull requests opened in the same minute kept jobs waiting for a
# runner for up to eleven minutes.
version: 2
# The gitleaks hook of .pre-commit-config.yaml and the gitleaks image of the
# secrets job (.github/images/gitleaks/Dockerfile) are the same release, so
# they are bumped in one pull request: a pull request of either alone failed
# the lint job (scripts/check_pins.py compares the two) and the secrets job
# (which compares the release the image reports with the hook's) until the
# other was pushed by hand. Each of the two entries below joins this group
# with all of its dependencies (patterns "*"); the pre-commit entry has no
# other hook, and the docker entry no other image. The group's schedule is
# the one of both entries.
#
# @playwright/test and its image (.github/images/playwright/Dockerfile) are
# not grouped like this: an entry joins a multi-ecosystem group as a whole,
# and the npm entry of "/" holds every other npm dependency too, which a
# second npm entry of the same directory may not split off. Dependabot does
# not bump that image at all, since a pull request of the image alone could
# only fail against the library; `python scripts/check_pins.py --fix` writes
# it on the library's branch (see the playwright group below).
multi-ecosystem-groups:
  gitleaks:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    # Dependabot refuses the limit on the entries of a multi-ecosystem
    # group; it takes it here
    open-pull-requests-limit: 3
updates:
  # Python dependencies: the ranges in pyproject.toml, the single source of
  # the Python dependencies, and their pins in uv.lock, which Dependabot
  # updates in the same pull request, so it tests the new release as it
  # comes. uv itself (the setup-toolchain action and the Dockerfile) is
  # bumped by hand, see there.
  - package-ecosystem: "uv"
    directory: "/"
    # The default rebase strategy: every pull request raises a range in the
    # flown entry of uv.lock, next to the ranges of the others, so the
    # second of two pull requests conflicts once the first is merged, and
    # Dependabot rebases it then rather than leaving it stuck
    # Raise the lower bound of a range to the new release. pyproject.toml
    # names a package, so the default ("auto") widens ranges instead, and a
    # ">=" range already admits every new release: from April to September
    # 2026 every run ended in "No update possible" and opened nothing.
    versioning-strategy: increase
    # A release has to be out this long before Dependabot proposes it, so a
    # compromised or broken one is usually yanked before it reaches a pull
    # request. Security updates are not held back. Every ecosystem below
    # waits a week: that is what zizmor's dependabot-cooldown audit asks for
    # at least, and nothing here needs a release sooner. A day more here:
    # uv.lock only takes releases a week old ([tool.uv] exclude-newer in
    # pyproject.toml), counted to the hour, and a release Dependabot counts
    # a week old by the day may not be yet. That holds back a security
    # update of this ecosystem as well: one to a release younger than a week
    # fails to lock until its package gets an exclude-newer-package entry.
    cooldown:
      default-days: 8
    schedule:
      interval: "daily"
      time: "07:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "uv"
      include: "scope"
    groups:
      testing:
        patterns:
          - "pytest*"
          - "coverage"
          - "hypothesis"
      linter:
        patterns:
          - "ruff"
          - "mypy"
          - "zizmor"
          - "pre-commit-hooks"
          - "typos"
      # The type stubs of lxml, bumped together with it
      core:
        patterns:
          - "lxml"
          - "lxml-stubs"
      # The tools that build and audit the packages
      packaging:
        patterns:
          - "pip-audit"
          - "packaging"
          - "setuptools"
      minifiers:
        patterns:
          - "rcssmin"
          - "minify-html"

  # JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    # See the cooldown of the uv entry
    cooldown:
      default-days: 7
    # Weekly: a release waits a week for the cooldown anyway, and a daily
    # run opened a pull request of the catch-all group below nearly every
    # day, each a full CI run. The schedule is the ecosystem's, not a
    # group's. Security updates do not wait for it.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, so `typescript`
      # stays on 6.x for it; the type checks run 7 through the `typescript7`
      # alias (see package.json). Dependabot skips npm aliases in version
      # updates, so that one is bumped by hand:
      # npm install -D --save-exact typescript7@npm:typescript@<version>
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # The catch-all at the end leaves out every package a named group
    # takes: the named groups came first, which was meant to keep their
    # packages out of it, but vitest, eslint and jsdom came in the catch-all
    # every time, and no testing group pull request ever opened. A change
    # in one of them that needed a fix of its own (jsdom 30.1.2 no longer
    # blurring a hidden element) then held back every other development
    # dependency with it.
    groups:
      # On its own because it cannot be merged as it comes: the visual and
      # e2e jobs run in the Playwright image, whose tag and digest in
      # .github/images/playwright/Dockerfile have to be bumped on the same
      # branch, with `python scripts/check_pins.py --fix`. The lint job
      # fails until they are (see the top).
      playwright:
        patterns:
          - "@playwright/test"
      # The unit tests' DOM and storage, and the e2e accessibility checks
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "fast-check"
          - "jsdom"
          - "fake-indexeddb"
          - "@axe-core/playwright"
      build-tools:
        patterns:
          - "esbuild"
          - "@babel/parser"
          - "@babel/types"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      # The style specification validates the app's layers in a unit test
      # (the map itself does not, see withoutValidation in mapHelpers.ts),
      # so it moves with the MapLibre release that depends on it
      maplibre:
        patterns:
          - "maplibre-gl"
          - "@maplibre/maplibre-gl-style-spec"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        # The patterns of the named groups above: a pattern added there
        # belongs here too (tests/test_dependabot.py)
        exclude-patterns:
          - "@playwright/test"
          - "vitest*"
          - "@vitest/*"
          - "fast-check"
          - "jsdom"
          - "fake-indexeddb"
          - "@axe-core/playwright"
          - "esbuild"
          - "@babel/parser"
          - "@babel/types"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
          - "typescript"
          - "typescript-eslint"
          - "maplibre-gl"
          - "@maplibre/maplibre-gl-style-spec"

  # GitHub Actions, pinned by commit SHA in .github/workflows and in the
  # composite actions of .github/actions, which "/" alone does not cover.
  # One pull request a week for all of them: most bumps are of the same few
  # actions of GitHub's own, and each pull request is a full CI run.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    # See the cooldown of the uv entry
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images: covers Dockerfile in the root directory. It carries a
  # tag and a digest, which Dependabot bumps together. The packaging job
  # builds and runs the image on every pull request, so a bump that breaks
  # it turns red.
  - package-ecosystem: "docker"
    directory: "/"
    # See the cooldown of the uv entry
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "13:00"
    open-pull-requests-limit: 3
    # Labels the repository has: Dependabot does not create a missing one,
    # it only comments on the pull request that it could not be found
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "docker"
    ignore:
      # The Python and Node.js versions follow .python-version and .nvmrc,
      # which CI uses and Dependabot does not bump; move all of them together
      # by hand (scripts/check_pins.py fails the lint job until every place
      # agrees). Node.js down to the patch release: .nvmrc names an exact
      # one, since the gzipped size budgets depend on the zlib it bundles.
      # Digest updates of the current tags still come through.
      - dependency-name: "library/python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "library/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # uv is the release the setup-toolchain action installs in CI as well,
      # which Dependabot does not bump; move both by hand
      # (scripts/check_pins.py fails the lint job until they agree; the
      # security job audits the release).
      # Digest updates of the current tag still come through.
      - dependency-name: "astral-sh/uv"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # pre-commit hook revisions. Only gitleaks is left as a pinned repo in
  # .pre-commit-config.yaml; the linters, formatters and file checks run
  # from the project environment, so nothing here can drift from what CI
  # installs. The gitleaks rev is bumped together with the image of the
  # secrets job, in the gitleaks group at the top.
  - package-ecosystem: "pre-commit"
    directory: "/"
    multi-ecosystem-group: "gitleaks"
    patterns:
      - "*"
    # See the cooldown of the uv entry
    cooldown:
      default-days: 7

  # The gitleaks image of the secrets job, the FROM line of a Dockerfile of
  # its own, by tag and digest, which this entry bumps together, in the
  # gitleaks group at the top
  - package-ecosystem: "docker"
    directory: "/.github/images/gitleaks"
    multi-ecosystem-group: "gitleaks"
    patterns:
      - "*"
    # See the cooldown of the uv entry
    cooldown:
      default-days: 7

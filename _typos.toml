[files]
# typos skips what .gitignore lists (the generated site and bundles); lock
# files are tracked but not worth spell checking
extend-exclude = [
  "*.lock",
  "package-lock.json",
  # Vendored OurAirports rows: IATA codes such as MUC and BRE are not words
  "tests/fixtures/*.csv",
]

[default.extend-words]
# Unicode general category "decimal number", used in Hypothesis strategies
Nd = "Nd"
# The PNG filter of Alan W. Paeth (flown/png.py)
paeth = "paeth"
# The National Elevation Dataset, in the attribution of the terrain tiles
NED = "NED"
# German month names, which flown/date_tokens.py takes out of names
januar = "januar"
februar = "februar"
juni = "juni"
juli = "juli"
oktober = "oktober"
dezember = "dezember"
# French month names without their accents, and the German "or" and "days",
# which flown/date_tokens.py reads in dates and keeps out of possible ones
aout = "aout"
decembre = "decembre"
oder = "oder"
tage = "tage"
# The time zone of India and Ireland, and the German "is", which
# flown/date_tokens.py tells apart by their case
ist = "ist"
# The German "before" of Vorweihnachten, which flown/date_tokens.py
# matches as a part of the word
vor = "vor"

[default.extend-identifiers]
# The plural of the image format, which typos would split into "PN" and "Gs"
PNGs = "PNGs"

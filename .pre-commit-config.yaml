---
# Install with: uv tool install pre-commit && pre-commit install
# The flights are left out of the fixers: data/, and every KML file, which
# also covers those of a copy's FLOWN_INPUT_DIR (doc/hosting.md) that the
# hooks cannot know; the generated site (docs/) is not tracked at all.
# Dependabot bumps the rev of gitleaks below. It is a commit, with the
# release in a comment (`pre-commit autoupdate --freeze` writes it so): a
# tag can be moved to other code, which would then run here on the next
# commit, before the flights are checked.
#
# The linters, the formatters and the file checks are local hooks
# (`repo: local`, `language: system`) rather than pinned mirrors, so no hook
# revision of their own can drift. They resolve from $PATH and node_modules
# instead, which is what CI installs only with the virtual environment
# active and `npm ci` run; see CONTRIBUTING.md.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # The hooks of pre-commit/pre-commit-hooks, which comes with the dev
      # extra in uv.lock, so they are the release the CI lint job runs over
      # every tracked file. Their own definitions, with the same file types.
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: (?i)^data/|\.km[lz]$
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
        exclude: (?i)^data/|\.km[lz]$
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: check-toml
        name: check toml
        entry: check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]

      # ruff is resolved off $PATH, so it is the uv.lock version CI
      # installs as long as the virtual environment is active.
      # --force-exclude makes it honour its default excludes (and any
      # pyproject.toml adds) even though pre-commit passes the file names
      # explicitly.
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # prettier is taken straight out of node_modules, so it is the version
      # package-lock.json pins and `npm run format:check` runs in CI
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --ignore-unknown
        language: system
        types: [text]

      # typos comes with the dev extra in uv.lock, so it is the release the
      # CI lint job runs
      - id: typos
        name: typos
        entry: typos --force-exclude
        language: system
        types: [text]

      # The obfuscation check of the CI lint job only runs once the dates are
      # already pushed to the public repository. It checks the KML files a
      # commit stages, wherever they are: those of data/, of a copy's
      # FLOWN_INPUT_DIR (doc/hosting.md) and the flights of the visual
      # snapshots, which are copies of real ones. Needs Python 3.14 as
      # `python`, such as the project's virtual environment (see
      # CONTRIBUTING.md). Verbose, as pre-commit shows a hook's output only
      # when it fails, and the possible dates it warns of fail nothing.
      - id: check-obfuscation
        name: check that the KML files are obfuscated
        entry: python scripts/pre_push.py --files
        language: system
        files: (?i)\.km[lz]$
        verbose: true
